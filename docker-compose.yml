services:
  postgres:
    image: postgres:16-alpine
    container_name: healory-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthtour
    volumes:
      - healory_pg_data:/var/lib/postgresql/data
      - ./scripts/docker/init-databases.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthtour"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healory_pg_data:
